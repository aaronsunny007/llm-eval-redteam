name: Try the demo

# One click, no model, no API key, about one minute. Open the Actions tab, choose
# "Try the demo", press "Run workflow", then open the run's Summary page to read the reports.
# It red-teams a vulnerable toy app (the gate fails, as it should) and the same app behind an
# output guard (the gate passes). See examples/demo/.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Red-team both toy apps
        run: python examples/demo/run_demo.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: demo-results
          path: demo-results
