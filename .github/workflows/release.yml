name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build && python -m build
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          notes=$(awk -v v="## [${tag#v}]" 'index($0,v)==1{f=1;next} /^## \[/{f=0} f' CHANGELOG.md)
          gh release create "$tag" dist/* --title "$tag" --notes "${notes:-Release $tag}"
