name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: llm-redteam validate
      - run: pytest -q

  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build
      - name: Bundled data ships in the wheel
        run: |
          python -m pip install dist/*.whl
          cd /tmp && llm-redteam validate

  action-self-test:
    # Runs the published action end-to-end against a mock HTTP service, with the
    # model-free detector judge, to prove the CI integration works without a GPU.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start mock target
        run: |
          python - <<'PY' &
          import json
          from http.server import BaseHTTPRequestHandler, HTTPServer
          class H(BaseHTTPRequestHandler):
              def do_POST(self):
                  self.rfile.read(int(self.headers["Content-Length"]))
                  body = json.dumps({"answer": "I can only answer questions about public filings."}).encode()
                  self.send_response(200); self.send_header("Content-Type", "application/json")
                  self.end_headers(); self.wfile.write(body)
              def log_message(self, *a): pass
          HTTPServer(("127.0.0.1", 8765), H).serve_forever()
          PY
          sleep 1
      - name: Write config
        run: |
          cat > selftest.yaml <<'YAML'
          name: action-self-test
          scenario: builtin:scenarios/finassist.yaml
          attacks: [builtin:attacks]
          benign: [builtin:benign]
          target: {type: http, url: "http://127.0.0.1:8765/ask", body: {question: "${prompt}"}, response_path: answer}
          judge: {model: null}
          defences: [none]
          output_dir: selftest-results
          gate: {defence: none, min_attacks: 0, max_attack_success_rate: 0.0, max_secret_leaks: 0}
          YAML
      - uses: ./
        with:
          config: selftest.yaml
          artifact-name: selftest-results
