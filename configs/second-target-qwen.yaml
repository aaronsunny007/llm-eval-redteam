# Full second-target study: Qwen 2.5 7B defended by the same five defences against the same 110
# attacks, with the same Mistral guards. Unlike the exploratory configs/replication-qwen.yaml
# (two defences, Qwen judging itself), the judge is Gemma 4 31B (free tier, needs GEMINI_API_KEY),
# so the target does not grade its own answers.
name: finassist-qwen2.5-7b-full
scenario: data/scenarios/finassist.yaml
attacks: [data/attacks]
benign: [data/benign]
target:
  type: chat
  model: {provider: ollama, model: "qwen2.5:7b", max_tokens: 400}
guard_model: {provider: ollama, model: mistral, max_tokens: 160}
judge:
  model:
    provider: openai
    model: gemma-4-31b-it
    base_url: https://generativelanguage.googleapis.com/v1beta/openai
    api_key_env: GEMINI_API_KEY
    seed: null
    max_tokens: 2048
defences: [none, hardened_prompt, input_guard, output_guard, layered]
output_dir: results/finassist-qwen2.5-7b-full
