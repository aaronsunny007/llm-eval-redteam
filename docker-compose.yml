# Ports are published on this machine only (no login on either service).
# docker compose up -d ollama dashboard
# docker compose run --rm redteam run configs/benchmark.yaml
services:
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"

  redteam:
    build: .
    depends_on: [ollama]
    volumes:
      - ./results:/app/results
      - ./data/labels:/app/data/labels

  dashboard:
    build: .
    entrypoint: ["streamlit", "run", "dashboard/app.py", "--server.port=8501", "--server.address=0.0.0.0"]
    ports:
      - "127.0.0.1:8501:8501"
    volumes:
      - ./results:/app/results
      - ./data/labels:/app/data/labels

volumes:
  ollama:
